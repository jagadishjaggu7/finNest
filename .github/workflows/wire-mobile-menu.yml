name: Wire mobile navigation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  wire-mobile-menu:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add mobile navigation script
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          marker = '        <script src="js/app.js"></script>'
          addition = marker + '\n        <script src="js/mobile-nav.js"></script>'

          if 'js/mobile-nav.js' not in text:
              if marker not in text:
                  raise SystemExit('Could not find app.js script tag in index.html')
              text = text.replace(marker, addition, 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Commit change
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Mobile navigation already wired."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Wire mobile More menu [skip ci]"
          git push
